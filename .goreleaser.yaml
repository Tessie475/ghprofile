# Builds release binaries for every platform on a tag push, so that nobody
# needs Go installed to use this tool.
#
# Untested locally: run "goreleaser release --snapshot --clean" before you rely
# on it, and "goreleaser check" to validate this file.
version: 2

project_name: ghprofile

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/ghprofile
    binary: ghprofile
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # install.sh builds URLs from this template, so changing it breaks the
  # installer.
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: |
    ## Install

    ```bash
    curl -sSfL https://raw.githubusercontent.com/Tessie475/ghprofile/main/scripts/install.sh | sh
    ```

    Or download the archive for your platform below and verify it against
    `checksums.txt`.

# Homebrew. GoReleaser writes the cask into your tap on every release.
#
# Casks, not formulae: "brews" is deprecated. The generated cask does carry
# Linux URLs, but Homebrew on Linux does not officially support casks, so the
# README points Linux users at the binary or scripts/install.sh.
#
# One-time setup, before the first tag:
#   1. Create a PUBLIC repository named exactly "homebrew-tap" under your
#      account. It can be empty. The "homebrew-" prefix is what makes
#      "brew install Tessie475/tap/ghprofile" resolve to it.
#   2. Create a fine-grained personal access token with Contents: read and
#      write, scoped to that one repository.
#   3. Add it to THIS repository as an Actions secret named HOMEBREW_TAP_TOKEN.
#
# See docs/releasing.md for the whole sequence.
homebrew_casks:
  - name: ghprofile
    repository:
      owner: Tessie475
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/Tessie475/ghprofile
    description: Use two GitHub accounts from one machine, in two commands
    license: MIT
    commit_author:
      name: Tessie475
      email: eberechichukwu1@gmail.com
    # macOS quarantines anything downloaded by a cask, and an unsigned binary
    # then refuses to run with "the developer cannot be verified". This clears
    # the attribute on install. From GoReleaser's own cask documentation.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ghprofile"]
          end
